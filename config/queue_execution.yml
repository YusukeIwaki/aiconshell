# Solid Queue supervisor config for the EXECUTION worker (compose
# `execution` service, Railway execution service).
#
# Runs workers bound to the `execution` queue only: AI CLI subprocess runs in
# isolated workspaces. The supervisor must ALSO be started with
# `--skip-recurring` (see compose.yml / docs/deployment.md) so the recurring
# scheduler runs solely on the control worker.
#
# Flat (no per-env keys): see config/queue_control.yml for why.
dispatchers:
  - polling_interval: 1
    batch_size: 500
workers:
  - queues: execution
    threads: 3
    processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
    polling_interval: 1
