# Legacy Config-as-Code service: select /railway.execution.toml.
# Set the service variable RUNTIME_TARGET=ai to include subscription CLIs.
# Clear any dashboard healthcheck path; workers do not serve HTTP.
# A separate /data volume and separate CLI logins are required for this
# service; it does not share the control worker's filesystem or credentials.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./bin/jobs --config-file=config/queue_execution.yml --skip-recurring"
preDeployCommand = []
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
