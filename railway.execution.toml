# Unified worker Config-as-Code service: select /railway.execution.toml.
# Set the service variable RUNTIME_TARGET=ai to include subscription CLIs.
# Clear any dashboard healthcheck path; the worker does not serve HTTP.
# This single worker consumes the control, execution, and ai_auth_execution
# queues in three separated pools and runs the recurring scheduler
# (see config/queue_execution.yml and docs/deployment.md). It holds the
# integration/ClickHouse settings for its Rails parent; AI CLI children
# never inherit them (lib/aiconshell/ai/child_env.rb).
# One /data volume holds /data/auth/* and /data/workspaces. The legacy
# control service selected /railway.control.toml (removed); its volume is
# neither reused nor deleted here — follow the Railway switchover and
# rollback procedure in docs/deployment.md, and the auth migration entry
# in docs/ai-connections.md (#20).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./bin/jobs --config-file=config/queue_execution.yml"
preDeployCommand = []
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
