# Railway service config (Config-as-Code) for the WEB service.
#
# Existing Config-as-Code services: select /railway.toml for web,
# /railway.control.toml for control, /railway.execution.toml for execution.
# Code settings override dashboard settings. Config-as-Code is deprecated;
# new services use the dashboard procedure in docs/deployment.md.
#
# Provision from the Railway catalog in the same project/environment:
#   - PostgreSQL plugin  -> provides DATABASE_URL (reference it, see below)
#   - ClickHouse template -> provides CLICKHOUSE_URL/USER/PASSWORD/DATABASE
# Each worker has its own single /data volume. Web has no AI auth volume.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Thruster fronts Puma and honors Railway's injected PORT.
startCommand = "./bin/thrust ./bin/rails server"
# SQL migrations only (db:prepare is idempotent). ClickHouse schema setup
# is intentionally separate (see docs/deployment.md): the EventLog is
# eventually consistent, so a logging outage must never block deploys.
# Run `railway ssh --service control -- /rails/bin/setup-clickhouse` remotely
# when ClickHouse is up; `railway run` would execute on the local machine.
preDeployCommand = "./bin/rails db:prepare"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
