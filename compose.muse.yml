# Optional Muse CLI override: adds an operator-supplied Muse binary to the
# worker images only. Base compose.yml parses and runs without this file,
# without MUSE_CLI_PATH, and without the binary.
#
#   MUSE_CLI_PATH=/abs/path/outside-repo/muse \
#     docker compose -f compose.yml -f compose.muse.yml up --build
#
# MUSE_CLI_PATH must be an absolute path to an authorized Linux Muse binary
# kept OUTSIDE the repository, matching the image architecture (amd64/arm64).
# Never commit the binary, credentials, or transcripts. Auth login stays a
# separate runtime step inside the workers (see docs/deployment.md).
#
# This override forces both workers to the ai target (operator intent is
# consistent) and forwards the muse_cli build secret to control/execution
# only, never to web. Rebuilding after adding, changing, or removing the
# binary requires --no-cache: BuildKit secret contents are not cache keys,
# so toggling the secret alone can reuse a stale layer.
services:
  control:
    build:
      target: ai
      secrets:
        - muse_cli
  execution:
    build:
      target: ai
      secrets:
        - muse_cli

secrets:
  muse_cli:
    file: ${MUSE_CLI_PATH:?set MUSE_CLI_PATH to an absolute repository-external authorized Linux muse binary}
